name: Test environment

on:
  push:
    branches: [feat/roteiro-offline-seguro]
  pull_request:

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test environment, navigation and notifications without database
        run: flutter test test/app_environment_test.dart test/navigation_destination_test.dart test/route_notification_test.dart
      - name: Build isolated Android test package (configuration intentionally empty)
        run: flutter build apk --debug --flavor teste --dart-define-from-file=config/test.example.json
